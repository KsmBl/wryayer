[package]
name = "wryayer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "wryayer"
path = "src/lib.rs"

[[bin]]
name = "wryayer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
shellexpand = "3"
libc = "0.2"
# Pure-Rust ELF parser: reads NEEDED sonames (and ELF class) in-process instead
# of forking readelf/strings per file across a whole container tree.
goblin = "0.9"
gtk4 = { version = "0.11", features = ["v4_10"], optional = true }
# Master-password store. App trees themselves are encrypted by VeraCrypt (see
# src/veracrypt.rs); these cover only the small file holding one container
# password per app, using a standard Argon2id -> AES-256-GCM construction
# rather than anything hand-rolled.
argon2 = "0.5"
aes-gcm = "0.10"
# Entropy extractor for the password generator (src/entropy.rs).
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
# No-echo password entry on the terminal.
rpassword = "7"

[features]
# The interactive terminal UI (ratatui/crossterm). On by default so the plain
# `cargo build` and CI keep the TUI; the installer lets users opt out.
tui = ["dep:ratatui", "dep:crossterm"]
# Native GTK4 desktop front-end (plain GTK, no libadwaita). Opt-in so the plain
# CLI/TUI builds (and CI) don't require the GTK development libraries.
gui = ["dep:gtk4"]
default = ["tui"]

[dev-dependencies]
tempfile = "3"
