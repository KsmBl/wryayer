[package]
name = "wryayer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "wryayer"
path = "src/lib.rs"

[[bin]]
name = "wryayer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
ratatui = "0.29"
crossterm = "0.28"
shellexpand = "3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
